<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhishShield AI · QR Scanner</title>
  <script>
    try {
      const current = JSON.parse(sessionStorage.getItem('ps_current') || 'null');
      if (!current || !current.email || !current.name) window.location.replace('login.html');
    } catch (err) {
      window.location.replace('login.html');
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
    try {
      if (localStorage.getItem('ps_theme') === 'dark') document.documentElement.classList.add('dark');
    } catch (err) {
      console.error('Could not load saved theme:', err);
    }
  </script>
  <style>
    :root { --bg: #eef4f9; --card: #fff; --text: #102b40; --sub: #617b90; --line: #dce7ef; }
    html.dark { --bg: #0c1925; --card: #172838; --text: #e8f1f8; --sub: #9ab0c2; --line: #2a4052; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 1.5rem; background: var(--bg); color: var(--text); font-family: 'Segoe UI', Roboto, sans-serif; }
    button, input { font: inherit; }
    .wrap { max-width: 760px; margin: 0 auto; }
    .topbar, .card { border: 1px solid var(--line); border-radius: 22px; background: var(--card); box-shadow: 0 8px 26px rgba(17, 47, 70, .07); }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; padding: 1rem 1.35rem; }
    .brand { display: flex; align-items: center; gap: .85rem; }
    .brand-icon { display: grid; width: 44px; height: 44px; place-items: center; border-radius: 14px; background: linear-gradient(135deg, #0b2b4b, #2879a5); color: #fff; font-size: 1.2rem; }
    h1 { margin: 0; font-size: 1.3rem; }
    .back { display: inline-flex; align-items: center; gap: .5rem; padding: .65rem 1rem; border-radius: 12px; background: #e7f1f9; color: #123b57; font-size: .9rem; font-weight: 700; text-decoration: none; }
    html.dark .back { background: #253e52; color: #e8f1f8; }
    .card { padding: 1.4rem; }
    .heading { display: flex; align-items: flex-start; gap: .75rem; margin-bottom: 1rem; }
    .heading i { margin-top: .2rem; color: #3181b1; }
    h2 { margin: 0; font-size: 1.08rem; }
    .hint { margin: .35rem 0 1rem; color: var(--sub); font-size: .9rem; line-height: 1.5; }
    input[type="file"] { width: 100%; padding: .9rem; border: 1px dashed var(--line); border-radius: 14px; background: var(--bg); color: var(--text); }
    .status { min-height: 1.4rem; margin: .85rem 0 0; color: var(--sub); font-size: .9rem; }
    .status.error { color: #b13e3e; }
    .result { display: none; margin-top: 1rem; padding: 1rem; border: 1px solid var(--line); border-radius: 16px; overflow-wrap: anywhere; }
    .result.show { display: block; }
    .result h3 { margin: 0 0 .65rem; font-size: 1rem; }
    .decoded { margin: 0 0 .8rem; color: var(--sub); white-space: pre-wrap; overflow-wrap: anywhere; }
    .indicators { margin: .65rem 0 0; padding-left: 1.2rem; color: var(--sub); line-height: 1.5; }
    .safe { border-color: #9cd3b3; }
    .caution { border-color: #e5c27b; }
    .phishing { border-color: #e3a0a0; }
    canvas { display: none; }
    @media (max-width: 520px) {
      body { padding: 1rem; }
      .topbar { padding: .85rem; }
      h1 { font-size: 1.1rem; }
      .card { padding: 1rem; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true"><i class="fas fa-qrcode"></i></div>
        <h1>QR Scanner</h1>
      </div>
      <a class="back" href="index.html"><i class="fas fa-arrow-left"></i> Dashboard</a>
    </header>
    <section class="card" aria-labelledby="qrHeading">
      <div class="heading">
        <i class="fas fa-shield-alt" aria-hidden="true"></i>
        <div>
          <h2 id="qrHeading">Scan a QR code image</h2>
          <p class="hint">Choose an image containing a QR code. It will be decoded in your browser and the decoded content will be checked for phishing.</p>
        </div>
      </div>
      <input id="qrFile" type="file" accept="image/*" aria-label="Choose a QR code image" />
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div id="result" class="result" aria-live="polite"></div>
      <canvas id="canvas"></canvas>
    </section>
  </main>
  <script>
    const qrFile = document.getElementById('qrFile');
    const statusBox = document.getElementById('status');
    const resultBox = document.getElementById('result');
    const canvas = document.getElementById('canvas');

    function setStatus(message, isError) {
      statusBox.textContent = message;
      statusBox.className = isError ? 'status error' : 'status';
    }

    async function postJson(action, body) {
      const response = await fetch(`api.php?action=${encodeURIComponent(action)}`, {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const payload = await response.json();
      if (response.status === 401) {
        window.location.replace('login.html');
        throw new Error('Please log in again.');
      }
      if (!response.ok) throw new Error(payload.error || 'The request could not be completed.');
      return payload;
    }

    function scanImage(file) {
      return new Promise((resolve, reject) => {
        if (typeof window.jsQR !== 'function') {
          reject(new Error('QR scanning is unavailable. Check your internet connection and try again.'));
          return;
        }
        const image = new Image();
        const objectUrl = URL.createObjectURL(file);
        image.onload = () => {
          URL.revokeObjectURL(objectUrl);
          try {
            canvas.width = image.naturalWidth;
            canvas.height = image.naturalHeight;
            const context = canvas.getContext('2d', { willReadFrequently: true });
            context.drawImage(image, 0, 0);
            const pixels = context.getImageData(0, 0, canvas.width, canvas.height);
            const decoded = window.jsQR(pixels.data, pixels.width, pixels.height, { inversionAttempts: 'attemptBoth' });
            if (!decoded) {
              reject(new Error('No QR code was found in that image. Try a clearer image.'));
              return;
            }
            resolve(decoded.data);
          } catch (err) {
            reject(new Error('The QR code image could not be decoded.'));
          }
        };
        image.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          reject(new Error('The selected file could not be opened as an image.'));
        };
        image.src = objectUrl;
      });
    }

    function riskPercent(result) {
      const risk = Number(result.percentage ?? result.score ?? Number(result.phishing_probability) * 100);
      return Math.max(0, Math.min(100, Math.round(Number.isFinite(risk) ? risk : 0)));
    }

    function confidencePercent(result) {
      let confidence = Number(result.confidence ?? 0);
      if (confidence <= 1) confidence *= 100;
      return Math.max(0, Math.min(100, Math.round(Number.isFinite(confidence) ? confidence : 0)));
    }

    function showResult(decoded, result) {
      const label = ['safe', 'caution', 'phishing'].includes(result.label) ? result.label : 'caution';
      const indicators = Array.isArray(result.indicators) ? result.indicators : [];
      resultBox.className = `result show ${label}`;
      resultBox.replaceChildren();

      const title = document.createElement('h3');
      title.textContent = `${label.toUpperCase()} — Risk ${riskPercent(result)}% · Confidence ${confidencePercent(result)}%`;
      const decodedText = document.createElement('p');
      decodedText.className = 'decoded';
      decodedText.textContent = `Decoded content: ${decoded}`;
      resultBox.append(title, decodedText);

      if (indicators.length) {
        const list = document.createElement('ul');
        list.className = 'indicators';
        indicators.forEach(indicator => {
          const item = document.createElement('li');
          item.textContent = indicator.detail || indicator.rule || 'Additional risk indicator';
          list.appendChild(item);
        });
        resultBox.appendChild(list);
      }
    }

    qrFile.addEventListener('change', async () => {
      resultBox.className = 'result';
      resultBox.replaceChildren();
      const file = qrFile.files && qrFile.files[0];
      if (!file) {
        setStatus('', false);
        return;
      }
      if (!file.type.startsWith('image/')) {
        setStatus('Choose an image file containing a QR code.', true);
        return;
      }
      setStatus('Reading QR code and checking its content...', false);
      try {
        const decoded = await scanImage(file);
        const result = await postJson('analyze-qr', { url: decoded });
        showResult(decoded, result);
        setStatus('QR analysis complete. Saving scan to history...', false);
        try {
          await postJson('scan', {
            type: 'qr',
            content: decoded,
            status: result.label,
            score: riskPercent(result),
            percentage: riskPercent(result),
            confidence: confidencePercent(result),
            flags: Array.isArray(result.indicators) ? result.indicators : [],
            urls: Array.isArray(result.urls) ? result.urls : [],
            explanation: Array.isArray(result.indicators) ? result.indicators : []
          });
          setStatus('QR analysis complete and saved to history.', false);
        } catch (err) {
          setStatus(`QR analysis complete, but history could not be saved: ${err.message}`, true);
        }
      } catch (err) {
        setStatus(err.message || 'The QR code could not be scanned.', true);
      }
    });
  </script>
</body>
</html>
